services:
  # =========================================================
  # 0. TRAEFIK (Reverse Proxy Dinámico para Subdominios)
  # =========================================================
  traefik:
    image: traefik:v3.0
    container_name: paasify_traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      # Descomentar en producción para HTTPS real
      # - "--entrypoints.websecure.address=:443"
      # - "--certificatesresolvers.letsencrypt.acme.email=tu@email.com"
      # - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      # - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
    ports:
      - "80:80"
      # - "443:443" # Descomentar en producción
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./volumes/traefik_certs:/letsencrypt
    networks:
      - traefik-net

  # =========================================================
  # 1. PAASIFY CORE (Backend Django / ASGI)
  # =========================================================
  paasify:
    image: davidrg25/paasify:latest # Actualizar con el tag deseado al desplegar
    container_name: paasify_core
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # DooD: Para que PaaSify pueda lanzar contenedores en la máquina anfitriona
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistencia de archivos estáticos y subidos por usuarios (local directory para poder ver los archivos)
      - ./volumes/media:/app/media
      - ./volumes/staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    networks:
      - traefik-net
      - default

  # =========================================================
  # 2. BASE DE DATOS (PostgreSQL)
  # =========================================================
  db:
    image: postgres:15-alpine
    container_name: paasify_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-paasify_db}
      POSTGRES_USER: ${DB_USER:-paasify_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mypassword}
    volumes:
      - ./volumes/db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-paasify_admin} -d ${DB_NAME:-paasify_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  # =========================================================
  # 3. PROXY INVERSO Y TLS (Nginx)
  # =========================================================
  nginx:
    image: nginx:alpine
    container_name: paasify_proxy
    restart: unless-stopped
    # Quite ports explicitly to let Traefik handle them
    # ports:
    #   - "80:80"
    #   - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro # Archivo para contraseñas de cAdvisor
      - ./volumes/staticfiles:/app/staticfiles:ro
      - ./volumes/media:/app/media:ro
    labels:
      - "traefik.enable=true"
      # Route both direct host and potential wildcard
      - "traefik.http.routers.paasify_main.rule=Host(`localhost`) || Host(`paas.tfg.etsii.urjc.es`)"
      - "traefik.http.routers.paasify_main.entrypoints=web"
      - "traefik.http.services.paasify_main.loadbalancer.server.port=80"
    depends_on:
      - paasify
      - cadvisor
    networks:
      - traefik-net
      - default

  # =========================================================
  # 4. MONITORIZACIÓN (cAdvisor)
  # =========================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: paasify_cadvisor
    command: -url_base_prefix=/monitorizacion
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - traefik-net
      - default

networks:
  traefik-net:
    # IMPORTANTE: Traefik necesita que esta red exista previamente de forma externa.
    # Debes crearla ejecutando este comando antes de hacer docker compose up:
    # docker network create traefik-net
    external: true
  default:
    driver: bridge


